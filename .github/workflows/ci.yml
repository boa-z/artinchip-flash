name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          toolchain="$(awk -F\" '/^channel =/ { print $2; exit }' rust-toolchain.toml)-${{ matrix.target }}"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"

      - name: Validate version and select build channel
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(awk -F\" '/^version =/ { print $2; exit }' Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          channel=development
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            channel=stable
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$HEAD_COMMIT_MESSAGE" != *'[skip nightly]'* ]]; then
            channel=nightly
          fi
          printf 'ARTINCHIP_FLASH_CHANNEL=%s\nARTINCHIP_FLASH_VERSION=%s\n' "$channel" "$version" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev dpkg-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install shared libusb on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $triplet = "$arch-windows"
          & "$root/vcpkg.exe" install "libusb:$triplet"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg libusb install failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$triplet" >> $env:GITHUB_ENV
          'VCPKGRS_DYNAMIC=1' >> $env:GITHUB_ENV
          "$root/installed/$triplet/bin" >> $env:GITHUB_PATH

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Independent core and SDK feature builds
        shell: bash
        run: |
          cargo test --locked -p aic-upg-core
          cargo check --locked -p artinchip-flash --no-default-features
          cargo check --locked -p artinchip-flash --no-default-features --features usb
          cargo check --locked -p artinchip-flash --no-default-features --features uart
          python scripts/check_sdk_consumer.py

      - name: Audit dependency licenses and collect attributions
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          python scripts/dependency_licenses.py --target "$target" --output THIRD-PARTY-LICENSES.txt

      - name: Build release binaries
        if: runner.os != 'Linux'
        run: cargo build --locked --release --bins

      - name: Build Linux release binaries and test the headless CLI
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --no-default-features --all-targets
          cargo build --locked --release --bin artinchip-flash-gui
          cargo build --locked --release --no-default-features --bin artinchip-flash
          target="$(rustc -vV | sed -n 's/^host: //p')"
          dependencies="$(cargo tree --locked --no-default-features --target "$target" --edges normal,build --prefix none)"
          if grep -E '^(aws-lc-(rs|sys)|reqwest|openssl-sys|eframe|egui|rfd|image|winit|glutin) ' <<< "$dependencies"; then
            exit 1
          fi
          python scripts/dependency_licenses.py --target "$target" --no-default-features --output THIRD-PARTY-LICENSES-CLI.txt

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $system = "windows-$($env:RUNNER_ARCH.ToLower())"
          $archive = "artinchip-flash-$system.zip"
          $version = $env:ARTINCHIP_FLASH_VERSION
          $repository = (Select-String -Path Cargo.toml -Pattern '^repository\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $arch = $env:RUNNER_ARCH.ToLower()
          $msiArch = if ($arch -eq 'arm64') { 'arm64' } else { 'x86' }
          New-Item -ItemType Directory -Force packages, dist | Out-Null

          Copy-Item target/release/artinchip-flash.exe "dist/artinchip-flash-$system.exe"
          Copy-Item target/release/artinchip-flash-gui.exe "dist/artinchip-flash-gui-$system.exe"
          Copy-Item README.md, LICENSE, NOTICE, THIRD-PARTY-LICENSES.txt dist/
          $linkLog = Get-ChildItem target/release/build/libusb1-sys-*/output | Get-Content
          if ($linkLog -contains 'cargo:vendored=1' -or $linkLog -notcontains 'cargo:rustc-link-lib=libusb-1.0') {
            throw 'Release must link against the replaceable libusb DLL'
          }
          $installed = "$env:VCPKG_ROOT/installed/$env:VCPKGRS_TRIPLET"
          Copy-Item "$installed/bin/libusb-1.0.dll" dist/
          $port = "$env:VCPKG_ROOT/ports/libusb"
          $libusbManifest = Get-Content "$port/vcpkg.json" -Raw | ConvertFrom-Json
          $libusbVersion = $libusbManifest.version ?? $libusbManifest.'version-semver' ?? $libusbManifest.'version-string'
          if (!$libusbVersion) { throw 'Cannot identify libusb source version' }
          New-Item -ItemType Directory -Force libusb-sources | Out-Null
          Copy-Item $port libusb-sources/vcpkg-port -Recurse
          $source = "libusb-sources/libusb-$libusbVersion.tar.gz"
          Invoke-WebRequest "https://github.com/libusb/libusb/archive/v$libusbVersion.tar.gz" -OutFile $source
          $checksum = (Select-String -Path "$port/portfile.cmake" -Pattern 'SHA512\s+([a-fA-F0-9]{128})').Matches.Groups[1].Value
          if ((Get-FileHash -Algorithm SHA512 $source).Hash -ne $checksum) { throw 'libusb source checksum mismatch' }
          Copy-Item "$installed/share/libusb/copyright" libusb-sources/COPYING
          Compress-Archive -Path libusb-sources/* -DestinationPath dist/libusb-source.zip -Force
          $cliVersion = & "./dist/artinchip-flash-$system.exe" --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion[0] -ne "artinchip-flash $version" -or
              $cliVersion -notcontains "channel: $env:ARTINCHIP_FLASH_CHANNEL") { throw 'Unexpected CLI build metadata' }
          Compress-Archive -Path dist/* -DestinationPath "packages/$archive" -Force

          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="artinchip-flash ArtInChip Flasher" Manufacturer="boa-w" Version="$version" UpgradeCode="{6E258C67-9E5F-48FD-BE41-4F53565B76ED}" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of artinchip-flash is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Property Id="ARPCOMMENTS" Value="Cross-platform CLI and GUI flasher for ArtInChip SoCs." />
              <Property Id="ARPCONTACT" Value="boa-w" />
              <Property Id="ARPURLINFOABOUT" Value="$repository" />
              <Icon Id="ArtInChipFlashIcon" SourceFile="assets\artinchip-flash.ico" />
              <Property Id="ARPPRODUCTICON" Value="ArtInChipFlashIcon" />
              <Property Id="ARPNOMODIFY" Value="1" />

              <StandardDirectory Id="ProgramFiles6432Folder">
                <Directory Id="INSTALLFOLDER" Name="artinchip-flash" />
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="artinchip-flash ArtInChip Flasher" />
              </StandardDirectory>

              <Feature Id="Main" Title="artinchip-flash" Level="1">
                <ComponentRef Id="CliExe" />
                <ComponentRef Id="GuiExe" />
                <ComponentRef Id="ReadmeFile" />
                <ComponentRef Id="ProjectLicense" />
                <ComponentRef Id="ProjectNotice" />
                <ComponentRef Id="ThirdPartyLicenses" />
                <ComponentRef Id="LibusbDll" />
                <ComponentRef Id="LibusbSource" />
                <ComponentRef Id="StartMenuShortcut" />
              </Feature>

              <Component Id="CliExe" Directory="INSTALLFOLDER" Guid="*">
                <File Id="CliFile" Source="target\release\artinchip-flash.exe" Name="artinchip-flash.exe" KeyPath="yes" />
              </Component>

              <Component Id="GuiExe" Directory="INSTALLFOLDER" Guid="*">
                <File Id="GuiFile" Source="target\release\artinchip-flash-gui.exe" Name="artinchip-flash-gui.exe" KeyPath="yes" />
              </Component>

              <Component Id="ReadmeFile" Directory="INSTALLFOLDER" Guid="*">
                <File Id="Readme" Source="README.md" Name="README.md" KeyPath="yes" />
              </Component>

              <Component Id="ProjectLicense" Directory="INSTALLFOLDER" Guid="*">
                <File Source="LICENSE" KeyPath="yes" />
              </Component>
              <Component Id="ProjectNotice" Directory="INSTALLFOLDER" Guid="*">
                <File Source="NOTICE" KeyPath="yes" />
              </Component>
              <Component Id="ThirdPartyLicenses" Directory="INSTALLFOLDER" Guid="*">
                <File Source="THIRD-PARTY-LICENSES.txt" KeyPath="yes" />
              </Component>
              <Component Id="LibusbDll" Directory="INSTALLFOLDER" Guid="*">
                <File Source="dist\libusb-1.0.dll" KeyPath="yes" />
              </Component>
              <Component Id="LibusbSource" Directory="INSTALLFOLDER" Guid="*">
                <File Source="dist\libusb-source.zip" KeyPath="yes" />
              </Component>

              <Component Id="StartMenuShortcut" Directory="ApplicationProgramsFolder" Guid="*">
                <Shortcut Id="ArtInChipFlashGuiShortcut" Name="artinchip-flash GUI" Target="[INSTALLFOLDER]artinchip-flash-gui.exe" WorkingDirectory="INSTALLFOLDER" Icon="ArtInChipFlashIcon" />
                <RemoveFolder Id="RemoveApplicationProgramsFolder" On="uninstall" />
                <RegistryValue Root="HKLM" Key="Software\boa-w\artinchip-flash" Name="installed" Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </Package>
          </Wix>
          "@ | Set-Content -Path installer.wxs -Encoding UTF8
          wix build -arch $msiArch installer.wxs -o "packages/artinchip-flash-$system.msi"
          if ($LASTEXITCODE -ne 0) { throw 'WiX build failed' }
          Remove-Item -Path packages/*.wixpdb -ErrorAction SilentlyContinue

          if ($arch -eq 'x64') {
          choco install innosetup --version=6.2.2 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          @"
          #define AppName "artinchip-flash ArtInChip Flasher"
          #define AppVersion "$version"

          [Setup]
          AppId={{6E258C67-9E5F-48FD-BE41-4F53565B76ED}
          AppName={#AppName}
          AppVersion={#AppVersion}
          VersionInfoVersion=$version
          AppPublisher=boa-w
          AppPublisherURL=$repository
          AppSupportURL=$repository
          AppUpdatesURL=$repository/releases
          DefaultDirName={autopf}\artinchip-flash
          DefaultGroupName=artinchip-flash ArtInChip Flasher
          DisableProgramGroupPage=yes
          OutputDir=packages
          OutputBaseFilename=artinchip-flash-$system-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          UninstallDisplayName=artinchip-flash ArtInChip Flasher
          SetupIconFile=assets\artinchip-flash.ico
          UninstallDisplayIcon={app}\artinchip-flash-gui.exe

          [Files]
          Source: "target\release\artinchip-flash.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\artinchip-flash-gui.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "README.md"; DestDir: "{app}"; Flags: ignoreversion
          Source: "LICENSE"; DestDir: "{app}"; Flags: ignoreversion
          Source: "NOTICE"; DestDir: "{app}"; Flags: ignoreversion
          Source: "THIRD-PARTY-LICENSES.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "dist\libusb-1.0.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "dist\libusb-source.zip"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\artinchip-flash GUI"; Filename: "{app}\artinchip-flash-gui.exe"; WorkingDir: "{app}"
          Name: "{group}\artinchip-flash CLI"; Filename: "{app}\artinchip-flash.exe"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\artinchip-flash-gui.exe"; Description: "Launch artinchip-flash GUI"; Flags: nowait postinstall skipifsilent unchecked
          "@ | Set-Content -Path installer.iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer.iss
          } else {
            iscc installer.iss
          }
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
          }

          $msi = (Resolve-Path "packages/artinchip-flash-$system.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0))
          $query = 'SELECT `Value` FROM `Property` WHERE `Property` = ''ProductVersion'''
          $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @($query))
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null) | Out-Null
          $row = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          if ($row.GetType().InvokeMember("StringData", "GetProperty", $null, $row, @(1)) -ne $version) {
            throw 'Unexpected MSI product version'
          }
          $msiRoot = Join-Path (Get-Location) 'verified-msi'
          $extract = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$msiRoot`"" -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw "MSI extraction failed ($($extract.ExitCode))" }
          Expand-Archive "packages/$archive" -DestinationPath verified-portable
          $msiPayload = (Get-ChildItem verified-msi -Recurse -Filter artinchip-flash.exe | Select-Object -First 1).Directory.FullName
          $payloads = @('verified-portable', $msiPayload)
          if ($arch -eq 'x64') {
            $setup = "packages/artinchip-flash-$system-setup.exe"
            $setupVersion = (Get-Item $setup).VersionInfo
            if ("$($setupVersion.FileMajorPart).$($setupVersion.FileMinorPart).$($setupVersion.FileBuildPart)" -ne $version) {
              throw 'Unexpected setup EXE file version'
            }
            Invoke-WebRequest 'https://constexpr.org/innoextract/files/innoextract-1.9-windows.zip' -OutFile innoextract.zip
            Expand-Archive innoextract.zip -DestinationPath innoextract-bin
            $inno = (Get-ChildItem innoextract-bin -Recurse -Filter innoextract.exe | Select-Object -First 1).FullName
            & $inno --extract --output-dir verified-inno $setup
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup extraction failed' }
            $payloads += (Get-ChildItem verified-inno -Recurse -Filter artinchip-flash.exe | Select-Object -First 1).Directory.FullName
          }
          foreach ($payload in $payloads) {
            foreach ($file in 'LICENSE', 'NOTICE', 'THIRD-PARTY-LICENSES.txt', 'libusb-source.zip', 'libusb-1.0.dll') {
              if ((Get-FileHash "$payload/$file").Hash -ne (Get-FileHash "dist/$file").Hash) { throw "$file differs in $payload" }
            }
          }

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          arch="$(dpkg --print-architecture)"
          system="linux-${arch/amd64/x64}"
          bash scripts/package_linux.sh
          bash scripts/check_linux_cli.sh target/release/artinchip-flash "packages/artinchip-flash-cli-$system.deb"

      - name: Test Debian 13 installation and package switching
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e ARTINCHIP_FLASH_VERSION --mount "type=bind,src=$PWD/packages,dst=/packages,readonly" debian:13-slim bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            set -o pipefail
            arch="$(dpkg --print-architecture)"
            system="linux-${arch/amd64/x64}"
            cli="/packages/artinchip-flash-cli-$system.deb"
            full="/packages/artinchip-flash-$system.deb"
            apt-get update
            apt-get install -y --no-install-recommends "$cli"
            test -f /usr/lib/udev/rules.d/99-artinchip-flash.rules
            test ! -e /usr/bin/artinchip-flash-gui
            if dpkg-query -W -f="\${db:Status-Abbrev} \${Package}\n" | grep -E "^ii +lib(x11|xcb|wayland|gl|egl|vulkan|llvm)"; then
              exit 1
            fi
            if [[ "$arch" == amd64 ]]; then
              apt-get install -y --no-install-recommends qemu-user
              cli_command=(timeout 30s qemu-x86_64 -cpu Nehalem /usr/bin/artinchip-flash)
              "${cli_command[@]}" --help >/dev/null
              "${cli_command[@]}" --version | grep -Fx "artinchip-flash $ARTINCHIP_FLASH_VERSION"
              "${cli_command[@]}" scan --json | grep -Fx "{\"devices\":[]}"
            else
              artinchip-flash --version | grep -Fx "artinchip-flash $ARTINCHIP_FLASH_VERSION"
            fi
            apt-get install -y --no-install-recommends "$full"
            test -x /usr/bin/artinchip-flash-gui
            test -f /usr/share/applications/artinchip-flash-gui.desktop
            apt-get install -y --no-install-recommends xvfb xauth
            gui_status=0
            XDG_CONFIG_HOME="$(mktemp -d)" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
              timeout --kill-after=3s 8s artinchip-flash-gui || gui_status=$?
            test "$gui_status" -eq 124
            apt-get install -y --no-install-recommends "$cli"
            dpkg-query -S /usr/bin/artinchip-flash | grep -Fx "artinchip-flash-cli: /usr/bin/artinchip-flash"
            dpkg-query -S /usr/lib/udev/rules.d/99-artinchip-flash.rules | grep -Fx "artinchip-flash-cli: /usr/lib/udev/rules.d/99-artinchip-flash.rules"
            test ! -e /usr/bin/artinchip-flash-gui
            artinchip-flash --version
          '

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: |
          system="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="artinchip-flash-${system}.tar.gz"
          version="$ARTINCHIP_FLASH_VERSION"
          target/release/artinchip-flash --version | grep -Fx "artinchip-flash $version"
          target/release/artinchip-flash --version | grep -Fx "channel: $ARTINCHIP_FLASH_CHANNEL"
          mkdir -p packages dist
          cp target/release/artinchip-flash "dist/artinchip-flash-${system}"
          cp target/release/artinchip-flash-gui "dist/artinchip-flash-gui-${system}"
          cp README.md LICENSE NOTICE THIRD-PARTY-LICENSES.txt dist/
          tar -czf "packages/$archive" -C dist .

          pkgroot="pkg-root"
          app="$pkgroot/Applications/artinchip-flash-gui.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$pkgroot/usr/local/bin"
          install -m 0755 target/release/artinchip-flash "$pkgroot/usr/local/bin/artinchip-flash"
          install -m 0755 target/release/artinchip-flash-gui "$app/Contents/MacOS/artinchip-flash-gui"
          install -m 0644 assets/artinchip-flash.icns "$app/Contents/Resources/artinchip-flash.icns"
          install -m 0644 LICENSE NOTICE THIRD-PARTY-LICENSES.txt "$app/Contents/Resources/"
          mkdir -p "$pkgroot/usr/local/share/doc/artinchip-flash"
          install -m 0644 LICENSE NOTICE THIRD-PARTY-LICENSES.txt "$pkgroot/usr/local/share/doc/artinchip-flash/"
          cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>artinchip-flash GUI</string>
            <key>CFBundleExecutable</key>
            <string>artinchip-flash-gui</string>
            <key>CFBundleIdentifier</key>
            <string>com.boaw.artinchip-flash-gui</string>
            <key>CFBundleName</key>
            <string>artinchip-flash-gui</string>
            <key>CFBundleIconFile</key>
            <string>artinchip-flash.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"
          pkgbuild --root "$pkgroot" --identifier "com.boaw.artinchip-flash" --version "$version" --install-location / "packages/artinchip-flash-${system}.pkg"
          otool -L target/release/artinchip-flash | grep -F 'libusb-1.0.0.dylib'
          pkgutil --expand-full "packages/artinchip-flash-${system}.pkg" verified-pkg
          plist=verified-pkg/Payload/Applications/artinchip-flash-gui.app/Contents/Info.plist
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version"
          test "$(xmllint --xpath 'string(/pkg-info/@version)' verified-pkg/PackageInfo)" = "$version"
          for file in LICENSE NOTICE THIRD-PARTY-LICENSES.txt; do
            tar -xOf "packages/$archive" "./$file" | cmp "$file" -
            cmp "$file" "verified-pkg/Payload/Applications/artinchip-flash-gui.app/Contents/Resources/$file"
            cmp "$file" "verified-pkg/Payload/usr/local/share/doc/artinchip-flash/$file"
          done

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: artinchip-flash-${{ runner.os }}-${{ runner.arch }}-packages
          path: packages/*
          if-no-files-found: error

  nightly:
    name: publish-nightly
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip nightly]')
    permissions:
      contents: write
    concurrency:
      group: nightly-release

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish nightly release
        uses: actions/github-script@v8
        env:
          ASSET_DIR: release-assets
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';
            const body = [
              `Automated nightly build from \`${context.sha}\`.`,
              '',
              'Portable archives and native installers are named as `artinchip-flash-<system>`.',
              'For headless Linux x86-64, use `artinchip-flash-cli-linux-x64.deb`.',
            ].join('\n');
            const current = (await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })).data.object.sha;
            if (current !== context.sha) {
              core.notice('A newer main commit superseded this build.');
              return;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(release => release.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'artinchip-flash nightly', draft: true, prerelease: true, make_latest: 'false',
              })).data;
            } else {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, body: 'Nightly assets are being refreshed.',
              });
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const asset of assets) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            try {
              await github.rest.git.updateRef({
                owner, repo, ref: `tags/${tag}`, sha: context.sha, force: true,
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha: context.sha,
              });
            }

            const assetDir = process.env.ASSET_DIR;
            for (const file of fs.readdirSync(assetDir)) {
              const fullPath = path.join(assetDir, file);
              if (!fs.statSync(fullPath).isFile()) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: file,
                data: fs.readFileSync(fullPath),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fs.statSync(fullPath).size,
                },
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, body, draft: false, prerelease: true, make_latest: 'false',
            });

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    concurrency:
      group: versioned-release-${{ github.ref }}

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish versioned release
        uses: actions/github-script@v8
        env:
          ASSET_DIR: release-assets
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              `Release \`${tag}\` built from \`${context.sha}\`.`,
              '',
              'Portable archives and native installers are named as `artinchip-flash-<system>`.',
              'For headless Linux x86-64, use `artinchip-flash-cli-linux-x64.deb`.',
              'The in-app updater (`artinchip-flash update`, GUI Settings) treats these `v*` tags as the stable channel.',
            ].join('\n');

            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(release => release.tag_name === tag);
            if (release && !release.draft) {
              core.notice(`Published ${tag} already exists. Keeping its original assets.`);
              return;
            }
            if (release && !release.body?.startsWith(body.split('\n')[0])) {
              throw new Error(`Draft ${tag} does not belong to this commit`);
            }
            if (!release) {
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `artinchip-flash ${tag}`,
                body,
                prerelease: false,
                draft: true,
              }).then(response => response.data);
            }

            const assetDir = process.env.ASSET_DIR;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const asset of assets) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            for (const file of fs.readdirSync(assetDir)) {
              const fullPath = path.join(assetDir, file);
              if (!fs.statSync(fullPath).isFile()) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: file,
                data: fs.readFileSync(fullPath),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fs.statSync(fullPath).size,
                },
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: 'true',
            });
