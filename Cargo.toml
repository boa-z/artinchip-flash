[workspace]
members = ["crates/aic-upg-core", "crates/artinchip-flash"]
default-members = ["."]
resolver = "2"

[package]
name = "artinchip-flash-app"
version = "0.2.2"
edition = "2021"
rust-version = "1.95"
description = "Cross-platform CLI and GUI firmware tools for ArtInChip SoCs"
repository = "https://github.com/boa-z/artinchip-flash"
license = "Apache-2.0"
build = "build.rs"

[[bin]]
name = "artinchip-flash"
path = "src/main.rs"

[[bin]]
name = "artinchip-flash-gui"
path = "src/bin/artinchip-flash-gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
artinchip-flash = { path = "crates/artinchip-flash", version = "0.2.0", features = ["usb", "uart"] }
clap = { version = "4", features = ["derive"] }
serialport = "4"
ctrlc = "3"
eframe = { version = "0.37", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.18", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
